<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Media, Video, Audio, YouTube and Plugins</title>
</head>
<body>
  <h1>Video</h1>
  <video width="500" controls poster="poster.jpg">
    <source src="movie.mp4" type="video/mp4">
    Your browser does not support video.
  </video>

  <h1>Audio</h1>
  <audio controls>
    <source src="music.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>

  <h1>YouTube</h1>
  <iframe width="500" height="280"
          src="https://www.youtube.com/embed/dQw4w9WgXcQ"
          title="YouTube video"
          allowfullscreen></iframe>

  <h1>Plugin concept</h1>
  <p>Modern HTML generally uses native media elements and embedded content instead of old browser plugins.</p>
</body>
</html>
