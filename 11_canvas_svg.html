<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas and SVG</title>
</head>
<body>
  <h1>Canvas</h1>
  <canvas id="myCanvas" width="400" height="180"
          style="border:1px solid black;"></canvas>

  <script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "green";
    ctx.fillRect(20, 20, 120, 70);

    ctx.beginPath();
    ctx.arc(250, 60, 35, 0, 2 * Math.PI);
    ctx.stroke();
  </script>

  <h1>SVG</h1>
  <svg width="400" height="180">
    <rect x="20" y="20" width="120" height="70" fill="blue"/>
    <circle cx="250" cy="55" r="35" fill="red"/>
    <line x1="20" y1="130" x2="350" y2="130"
          stroke="black" stroke-width="3"/>
  </svg>
</body>
</html>
