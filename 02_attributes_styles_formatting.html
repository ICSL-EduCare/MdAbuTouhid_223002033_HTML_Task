<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attributes, Styles and Formatting</title>
</head>
<body>
  <h1 style="color:blue;">HTML Attributes and Styles</h1>

  <p title="This is a tooltip">Move your mouse over this paragraph.</p>

  <p style="color:red;">Red text</p>
  <p style="background-color:yellow;">Yellow background</p>
  <p style="font-size:24px; text-align:center;">Large centered text</p>

  <p><b>Bold</b>, <strong>important</strong>, <i>italic</i>,
     <em>emphasized</em>, <mark>marked</mark></p>
  <p><small>Small text</small>, <del>deleted</del>,
     <ins>inserted</ins>, H<sub>2</sub>O, x<sup>2</sup></p>
</body>
</html>
