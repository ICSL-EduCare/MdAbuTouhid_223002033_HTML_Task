<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Forms</title>
</head>
<body>
  <h1>Complete Form Example</h1>

  <form action="/submit" method="post" autocomplete="on">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required autofocus><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="you@example.com"><br><br>

    <label>Password:</label>
    <input type="password" name="password" minlength="6"><br><br>

    <label>Age:</label>
    <input type="number" name="age" min="1" max="100"><br><br>

    <label>Date:</label>
    <input type="date" name="date"><br><br>

    <label>Time:</label>
    <input type="time" name="time"><br><br>

    <label>Favorite color:</label>
    <input type="color" name="color"><br><br>

    <label>Website:</label>
    <input type="url" name="website"><br><br>

    <label>Search:</label>
    <input type="search" name="search"><br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female<br><br>

    <input type="checkbox" name="terms" required> I agree<br><br>

    <label for="country">Country:</label>
    <select id="country" name="country">
      <option value="bd">Bangladesh</option>
      <option value="in">India</option>
      <option value="pk">Pakistan</option>
    </select><br><br>

    <label>Message:</label><br>
    <textarea name="message" rows="5" cols="40"></textarea><br><br>

    <label>Choose a browser:</label>
    <input list="browsers" name="browser">
    <datalist id="browsers">
      <option value="Chrome">
      <option value="Edge">
      <option value="Firefox">
    </datalist><br><br>

    <input type="file" name="file"><br><br>
    <input type="range" name="range" min="0" max="100"><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>
