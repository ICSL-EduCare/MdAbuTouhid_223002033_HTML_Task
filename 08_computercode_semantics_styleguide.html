<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Computer Code, Semantics and Style Guide</title>
</head>
<body>
  <header>
    <h1>Semantic HTML</h1>
  </header>

  <nav>
    <a href="#article">Article</a> |
    <a href="#code">Code</a>
  </nav>

  <main>
    <article id="article">
      <h2>Article</h2>
      <p>Semantic tags describe the meaning of content.</p>
      <figure>
        <img src="image.jpg" alt="Example image" width="200">
        <figcaption>Example figure caption.</figcaption>
      </figure>
    </article>

    <section id="code">
      <h2>Computer Code</h2>
      <p>Use <code>print("Hello")</code> for inline code.</p>
      <pre><code>
function hello() {
  console.log("Hello");
}
      </code></pre>
      <p>Keyboard input: <kbd>Ctrl</kbd> + <kbd>S</kbd></p>
      <p>Variable: <var>x</var> = 10</p>
      <p>Program output: <samp>Hello World</samp></p>
    </section>
  </main>

  <footer>
    <p>Keep HTML clean, semantic and readable.</p>
  </footer>
</body>
</html>
