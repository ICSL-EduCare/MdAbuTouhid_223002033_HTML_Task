<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Entities, Symbols, Emojis, Charset and URL Encoding</title>
</head>
<body>
  <h1>HTML Characters</h1>

  <p>Less than: &lt;</p>
  <p>Greater than: &gt;</p>
  <p>Ampersand: &amp;</p>
  <p>Copyright: &copy; 2026</p>
  <p>Registered: &reg;</p>
  <p>Euro: &euro;</p>

  <p>Symbols: &hearts; &star; &check;</p>
  <p>Emoji: &#128512; &#128525; &#128640;</p>

  <p>Non-breaking spaces: A&nbsp;&nbsp;&nbsp;B</p>

  <h2>URL Encoding</h2>
  <p>Spaces in URLs are commonly encoded as %20.</p>

  <h2>HTML vs XHTML</h2>
  <p>XHTML follows stricter XML-style syntax rules.</p>
</body>
</html>
