<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Div, Class, ID and Iframe</title>
  <style>
    .card { border: 1px solid #999; padding: 15px; margin: 10px; }
    #special { background: #eee; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Card One</h2>
    <p>This uses a class.</p>
  </div>

  <div class="card" id="special">
    <h2>Special Card</h2>
    <p>This uses both class and id.</p>
  </div>

  <h2>Iframe</h2>
  <iframe src="https://www.w3schools.com"
          title="Embedded web page"
          width="500"
          height="250"></iframe>
</body>
</html>
