<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="./">
  <title>Head, Layout, File Paths and Responsive</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; }
    header, footer { padding: 20px; text-align: center; background: #222; color: white; }
    nav { padding: 15px; text-align: center; background: #ddd; }
    main { display: flex; gap: 20px; padding: 20px; }
    section, aside { padding: 20px; border: 1px solid #aaa; }
    section { flex: 3; }
    aside { flex: 1; }
    @media (max-width: 600px) {
      main { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header><h1>Responsive Page</h1></header>
  <nav>
    <a href="index.html">Home</a> |
    <a href="pages/about.html">About</a>
  </nav>

  <main>
    <section>
      <h2>JavaScript</h2>
      <p id="message">Original message</p>
      <button onclick="changeMessage()">Click me</button>
    </section>
    <aside>
      <h2>Aside</h2>
      <p>Responsive layout example.</p>
    </aside>
  </main>

  <footer>Footer</footer>

  <script>
    function changeMessage() {
      document.getElementById("message").textContent = "Message changed!";
    }
  </script>
</body>
</html>
