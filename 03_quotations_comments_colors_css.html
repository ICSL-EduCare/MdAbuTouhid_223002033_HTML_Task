<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quotations, Colors and CSS</title>
  <style>
    body { background-color: #f2f2f2; }
    .box { color: white; background-color: #333; padding: 15px; }
  </style>
</head>
<body>
  <h1>Quotations</h1>
  <p>Short quote: <q>Learning HTML is fun.</q></p>

  <blockquote cite="https://example.com">
    This is a blockquote used for a longer quotation.
  </blockquote>

  <p><abbr title="HyperText Markup Language">HTML</abbr> is a markup language.</p>
  <address>
    Written by Student<br>
    Dhaka, Bangladesh
  </address>

  <!-- CSS can be inline, internal or external -->
  <div class="box">This element is styled with internal CSS.</div>
</body>
</html>
